<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Opening: A familiar look, wherever I build.</title><desc>A clear title, one sentence of context, and room for the author.</desc><rect width="1200" height="675" fill="#f6f5f1"/><text x="64" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#205f49" font-weight="700">UI PACK</text><text x="64" y="277" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="78" fill="#1a1c1a" font-weight="600">A familiar look,</text><text x="64" y="371" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="78" fill="#1a1c1a" font-weight="600">wherever I build.</text><text x="64" y="457" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" fill="#5c625e" font-weight="400">Shared type, colour and spacing for websites and slides.</text><path d="M64 592H1136" stroke="#bac3bc" stroke-width="2"/><text x="64" y="635" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5c625e" font-weight="400">UI Pack / Jun Xiong</text><text x="1010" y="635" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5c625e" font-weight="400">01 / 03</text></svg>