<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>System: One foundation. Two ways to use it.</title><desc>A flow with labeled steps and a caption that explains the decision.</desc><rect width="1200" height="675" fill="#f6f5f1"/><text x="64" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#205f49" font-weight="700">HOW IT FITS TOGETHER</text><text x="64" y="196" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="52" fill="#1a1c1a" font-weight="600">One foundation. Two ways to use it.</text><rect x="64" y="295" width="288" height="138" fill="#ffffff" stroke="#bac3bc" stroke-width="2"/><text x="88" y="351" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" fill="#1a1c1a" font-weight="600">Foundation</text><text x="88" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5c625e" font-weight="400">Type and colour</text><path d="M366 364h70m-10-8 10 8-10 8" fill="none" stroke="#205f49" stroke-width="3"/><rect x="456" y="295" width="288" height="138" fill="#ffffff" stroke="#bac3bc" stroke-width="2"/><text x="480" y="351" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" fill="#1a1c1a" font-weight="600">Layouts</text><text x="480" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5c625e" font-weight="400">Structure and motion</text><path d="M758 364h70m-10-8 10 8-10 8" fill="none" stroke="#205f49" stroke-width="3"/><rect x="848" y="295" width="288" height="138" fill="#ffffff" stroke="#bac3bc" stroke-width="2"/><text x="872" y="351" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" fill="#1a1c1a" font-weight="600">Output</text><text x="872" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5c625e" font-weight="400">Websites and slides</text><text x="64" y="521" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="27" fill="#5c625e" font-weight="400">Reuse the decisions, then choose the layout for the job.</text><path d="M64 592H1136" stroke="#bac3bc" stroke-width="2"/><text x="64" y="635" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5c625e" font-weight="400">UI Pack / Jun Xiong</text><text x="1010" y="635" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5c625e" font-weight="400">03 / 03</text></svg>