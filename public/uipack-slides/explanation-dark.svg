<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="UI Pack explanation slide starter"><rect width="1200" height="675" fill="#0E1512"/><text x="64" y="105" font-family="IBM Plex Mono, monospace" font-size="22" fill="#71DCB2" font-weight="700">The design rule</text><text x="64" y="196" font-family="IBM Plex Sans, Arial, sans-serif" font-size="52" fill="#E6EBE8" font-weight="600">Start with what stays the same.</text><rect x="64" y="264" width="440" height="256" fill="#151F1B" stroke="#43544B"/><text x="96" y="328" font-family="IBM Plex Mono, monospace" font-size="22" fill="#71DCB2" font-weight="700">The foundation</text><text x="96" y="399" font-family="IBM Plex Sans, Arial, sans-serif" font-size="30" fill="#E6EBE8" font-weight="600">Type. Colour. Spacing.</text><text x="96" y="452" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" fill="#A5B3AD" font-weight="400">A shared starting point.</text><text x="568" y="310" font-family="IBM Plex Sans, Arial, sans-serif" font-size="30" fill="#E6EBE8" font-weight="600">Websites</text><text x="568" y="358" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" fill="#A5B3AD" font-weight="400">Layouts adapt to the content and screen.</text><text x="568" y="442" font-family="IBM Plex Sans, Arial, sans-serif" font-size="30" fill="#E6EBE8" font-weight="600">Slides</text><text x="568" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" fill="#A5B3AD" font-weight="400">Layouts keep one idea in focus.</text><path d="M64 592H1136" stroke="#43544B" stroke-width="2"/><text x="64" y="635" font-family="IBM Plex Mono, monospace" font-size="18" fill="#A5B3AD" font-weight="400">UI Pack / Jun Xiong</text><text x="960" y="635" font-family="IBM Plex Mono, monospace" font-size="18" fill="#A5B3AD" font-weight="400">02 / 03</text></svg>